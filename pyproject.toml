[project]
name = "attendlog"
version = "0.1.0"
description = "Local-first college attendance, built incrementally."
requires-python = ">=3.12,<3.14"
dependencies = [
  "Flask>=3.1,<3.2",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "Flask-WTF>=1.2,<2",
  "email-validator>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
